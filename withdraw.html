{% extends "base.html" %}
{% block title %}Вывод средств{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="mb-3">Вывод средств</h4>
            <div class="alert alert-info">
                Ваш текущий баланс: <strong>{{ balance }} руб.</strong>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label>Номер телефона (СБП)</label>
                    <input type="text" name="phone" class="form-control" placeholder="+7XXXXXXXXXX" required>
                </div>
                <div class="mb-3">
                    <label>Сумма (руб.)</label>
                    <input type="number" name="amount" class="form-control" placeholder="Введите сумму" min="1">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="withdraw_all" class="form-check-input" id="all">
                    <label class="form-check-label" for="all">Вывести всё ({{ balance }} руб.)</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Создать заявку</button>
            </form>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">
                &larr; Вернуться назад
            </a>
        </div>
    </div>
</div>
{% endblock %}
